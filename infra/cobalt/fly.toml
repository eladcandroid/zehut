app = "zehut-cobalt"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  API_URL = "https://zehut-cobalt.fly.dev/"
  API_PORT = "9000"
  API_KEY_URL = "file:///keys.json"
  API_AUTH_REQUIRED = "1"
  CORS_WILDCARD = "1"
  DURATION_LIMIT = "10800"
  RATELIMIT_WINDOW = "60"
  RATELIMIT_MAX = "60"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
